name: fb_post_scheduler
description: "Facebook Post Scheduler and Content Manager Flutter Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Local Push Notification & Background Execution
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  workmanager: ^0.5.2

  # Sharing & External Launching
  share_plus: ^10.0.2
  url_launcher: ^6.3.0

  # UI & Calendar
  table_calendar: ^3.1.2
  intl: ^0.19.0
  image_picker: ^1.1.2

  # AI & Utilities
  google_generative_ai: ^0.4.6
  local_auth: ^2.3.0
  speech_to_text: ^7.0.0
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
